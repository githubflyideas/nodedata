<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nodedata — L0 Sanity Check</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #fff;
      letter-spacing: 1px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .control-btn {
      background: #222;
      border: 1px solid #444;
      color: #0f0;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s;
    }
    .control-btn:hover {
      background: #333;
      border-color: #555;
    }
    .timestamp {
      color: #666;
      font-size: 12px;
    }
    .category-panel {
      background: #1a1a1a;
      border-left: 3px solid #444;
      margin-bottom: 12px;
      padding: 16px;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .category-panel.pass {
      border-left-color: #0f0;
      background: #0f0f1a;
    }
    .category-panel.warn {
      border-left-color: #fa0;
      background: #1a1510;
    }
    .category-panel.fail {
      border-left-color: #f00;
      background: #1a0f0f;
    }
    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: monospace;
    }
    .category-name {
      flex: 1;
    }
    .category-status {
      color: #0f0;
      min-width: 50px;
      text-align: right;
    }
    .category-panel.warn .category-status {
      color: #fa0;
    }
    .category-panel.fail .category-status {
      color: #f00;
    }
    .category-checks {
      display: grid;
      gap: 8px;
      font-size: 13px;
      font-family: monospace;
      margin-top: 8px;
    }
    .check-item {
      padding: 6px 8px;
      background: #0f0f0f;
      border-radius: 3px;
      display: flex;
      gap: 8px;
    }
    .check-symbol {
      width: 16px;
      color: #0f0;
      font-weight: bold;
    }
    .check-symbol.warn {
      color: #fa0;
    }
    .check-symbol.fail {
      color: #f00;
    }
    .check-id {
      width: 35px;
      color: #666;
      font-weight: 600;
    }
    .check-msg {
      flex: 1;
      color: #aaa;
    }
    .summary {
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 16px;
      margin-top: 20px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      text-align: center;
    }
    .summary.pass {
      color: #0f0;
      border-color: #0f0;
      background: #0f0f1a;
    }
    .summary.warn {
      color: #fa0;
      border-color: #fa0;
      background: #1a1510;
    }
    .summary.fail {
      color: #f00;
      border-color: #f00;
      background: #1a0f0f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 nodedata L0 Sanity Check</h1>
    
    <div class="controls">
      <button class="control-btn" onclick="manualRefresh()">⟲ Refresh Now</button>
      <span class="timestamp">Last: <span id="ts">—</span></span>
    </div>

    <div id="categories-container"></div>
    <div id="summary" class="summary"></div>
  </div>

  <script>
    async function updateStatus() {
      try {
        const response = await fetch('/api/check');
        if (!response.ok) {
          document.getElementById('summary').textContent = 'Error: Failed to fetch /api/check';
          return;
        }
        
        const result = await response.json();
        if (!result.categories || result.categories.length === 0) {
          document.getElementById('summary').textContent = 'Initializing...';
          return;
        }

        renderCategories(result);
        renderSummary(result);
        document.getElementById('ts').textContent = new Date(result.timestamp).toLocaleTimeString();

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('summary').textContent = 'Error: ' + error.message;
      }
    }

    function renderCategories(result) {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';

      for (const cat of result.categories) {
        const level = cat.level || 0;
        const levelName = level === 0 ? 'pass' : level === 1 ? 'warn' : 'fail';
        const levelSymbol = level === 0 ? '✓' : level === 1 ? '⚠' : '✗';
        const levelText = level === 0 ? 'OK' : level === 1 ? 'WARN' : 'FAIL';

        const panel = document.createElement('div');
        panel.className = `category-panel ${levelName}`;

        const header = `
          <div class="category-header">
            <span class="category-name">${levelSymbol} ${cat.name}</span>
            <span class="category-status">${cat.passed}/${cat.total}</span>
          </div>
        `;

        let checks = '';
        if (cat.checks && cat.checks.length > 0) {
          for (const check of cat.checks) {
            if (check.level > 0) {
              const checkLevel = check.level === 1 ? 'warn' : 'fail';
              const checkSymbol = check.level === 1 ? '⚠' : '✗';
              checks += `
                <div class="check-item">
                  <span class="check-symbol ${checkLevel}">${checkSymbol}</span>
                  <span class="check-id">${check.id}</span>
                  <span class="check-msg">${check.message}</span>
                </div>
              `;
            }
          }
        }

        panel.innerHTML = header + (checks ? `<div class="category-checks">${checks}</div>` : '');
        container.appendChild(panel);
      }
    }

    function renderSummary(result) {
      const summary = document.getElementById('summary');
      const hasFailure = result.categories.some(c => c.level === 2);
      const hasWarn = result.categories.some(c => c.level === 1);
      const statusClass = hasFailure ? 'fail' : hasWarn ? 'warn' : 'pass';
      const statusText = hasFailure ? '✗ Some checks FAILED' : hasWarn ? '⚠ Warnings detected' : '✓ All checks PASSED';
      
      summary.className = `summary ${statusClass}`;
      summary.textContent = statusText;
    }

    function manualRefresh() {
      updateStatus();
    }

    // Initial load
    updateStatus();
    // Auto-refresh every 5 seconds
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
