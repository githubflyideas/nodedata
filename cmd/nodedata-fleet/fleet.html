<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>nodedata 巡视台</title>
<style>
:root{
  color-scheme:dark;
  --ground:#0d1318; --panel:#141c23; --panel2:#1a242d; --line:#25313b;
  --text:#d6dfe5; --dim:#7b8a95; --faint:#4b5863; --accent:#8fb8d6;
  --ok:#3f9b79; --ok-bg:#15291f; --dev:#d8a33f; --dev-bg:#2e2512;
  --bad:#e2544b; --bad-bg:#351715; --lost:#8b80b3; --lost-bg:#211e2e; --none:#46525c;
  --sans:"IBM Plex Sans Condensed","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--sans);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 顶栏 */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.04em;font-size:15px;white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;margin-left:6px}
.dims{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.dims button{padding:7px 14px;border-radius:6px;color:var(--dim);white-space:nowrap;font-size:15px}
.dims button[aria-pressed="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.top .sp{flex:1}
.sample{font-size:12px;color:var(--dev);border:1px solid #5a4620;border-radius:4px;padding:2px 7px;letter-spacing:.06em}
.clock{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;color:var(--text)}
.tool{color:var(--dim);font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}

/* 轮播 */
.stage{position:relative;flex:1;min-height:0}
.track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:18px 64px 24px}
.track.fade{opacity:0;transition:opacity .18s}
.track{transition:opacity .25s}

.edge{position:absolute;top:0;bottom:0;width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:.28;transition:opacity .2s;z-index:2}
.edge:hover,.edge:active,.stage.touched .edge{opacity:.95}
.edge.l{left:0;background:linear-gradient(90deg,rgba(13,19,24,.9),transparent)}
.edge.r{right:0;background:linear-gradient(270deg,rgba(13,19,24,.9),transparent)}
.edge svg{width:26px;height:26px;stroke:var(--text);fill:none;stroke-width:2.2}
.edge .cnt{font-family:var(--mono);font-size:12px;min-width:22px;text-align:center;padding:1px 5px;border-radius:9px;color:#111}
.edge .cnt.bad{background:var(--bad)} .edge .cnt.dev{background:var(--dev)} .edge .cnt.lost{background:var(--lost)}

/* 底栏 */
.foot{display:flex;align-items:center;gap:14px;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:14px;color:var(--dim);flex-wrap:wrap}
.foot .pos{font-family:var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:120px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar.paused i{background:var(--faint)}
.foot select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:inherit;font-size:13px}
.back{color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px}

/* 通用状态 */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:5px;padding:2px 9px;font-size:14px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.dev{background:var(--dev-bg);color:var(--dev)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.lost{background:var(--lost-bg);color:var(--lost)}
.pill.none{background:var(--panel2);color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 分组页 */
.ghead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.ghead .kind{color:var(--dim);font-size:14px;letter-spacing:.08em}
.ghead h2{margin:0;font-size:34px;font-weight:600;line-height:1.1;text-wrap:balance}
.ghead .counts{display:flex;gap:8px;flex-wrap:wrap}
.facts{margin:0 0 14px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;gap:4px;font-size:15px}
.facts .lbl{color:var(--dim);font-size:12px;letter-spacing:.1em}
.facts .f b{font-weight:600}
.facts .f .who{color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tiles.dense{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 10px;display:grid;gap:7px;position:relative}
.tile::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:transparent}
.tile.dev::before{background:var(--dev)} .tile.bad::before{background:var(--bad)} .tile.lost::before{background:var(--lost)}
.tile.bad{background:#1e1719} .tile.lost{background:repeating-linear-gradient(135deg,var(--panel) 0 8px,#1b1a24 8px 16px)}
.tile .nm{font-family:var(--mono);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles.dense .tile{padding:7px 8px;gap:5px} .tiles.dense .nm{font-size:12.5px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.segs span{height:14px;border-radius:2px;background:var(--ok);opacity:.55;font-size:10px;line-height:14px;text-align:center;color:#0d1318;font-weight:600}
.tiles.dense .segs span{height:10px;line-height:10px;font-size:0}
.segs .dev{background:var(--dev);opacity:1} .segs .bad{background:var(--bad);opacity:1} .segs .none{background:var(--none);opacity:.7}
.tile .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.tiles.dense .sub{display:none}
.legend{margin-top:12px;color:var(--faint);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}

/* 主机页 */
.hwrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:22px;align-items:start}
.hid h2{margin:0 0 6px;font-family:var(--mono);font-size:30px;font-weight:500;word-break:break-all}
.alink{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.copy{font:inherit;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px;cursor:pointer;background:transparent}
.copy:hover,.copy:focus-visible{color:var(--text);border-color:var(--accent)}
.copy.done{color:var(--ok);border-color:var(--ok)}
.alink:hover,.alink:focus-visible{color:var(--accent)}
.hid .addr{font-family:var(--mono);color:var(--dim);margin-bottom:14px}
.hid dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.hid dt{color:var(--dim)} .hid dd{margin:0}
.hid .tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;font-size:13px}
.hid .seen{margin-top:14px;font-size:13px;color:var(--dim)}
.use{display:grid;gap:8px}
.urow{display:grid;grid-template-columns:64px 78px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.urow .res{font-weight:600;font-size:18px}
.urow .rd{font-size:16px;line-height:1.55}
.urow .rd .u{color:var(--dim);font-size:14px}
.urow .rd .who{display:block;color:var(--accent);font-size:14px;margin-top:2px}
.urow .rd .ck{display:block;color:var(--faint);font-size:13px;margin-top:2px}
.urow.bad{border-color:#5a2724} .urow.dev{border-color:#4e3d1c}
.lostbox{grid-column:1/-1;background:var(--lost-bg);border:1px solid #3d3656;border-radius:8px;padding:12px 14px;color:var(--lost);font-size:16px}

/* 清单抽屉 */
.drawer{position:fixed;inset:0;background:rgba(5,8,11,.72);display:flex;justify-content:flex-end;z-index:10}
.drawer .in{width:min(640px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:16px}
.drawer h3{margin:0;font-size:18px}
.drawer p{margin:0;color:var(--dim);font-size:13px;line-height:1.6}
.drawer textarea{flex:1;background:var(--ground);color:var(--text);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:10px;resize:none;white-space:pre;overflow:auto}
.drawer .row{display:flex;gap:10px;align-items:center}
.drawer .go{background:var(--accent);color:#0d1318;border-radius:6px;padding:7px 16px;font-weight:600}
.drawer .err{color:var(--bad);font-size:13px}

@media (max-width:760px){
  .page{padding:14px 44px 18px}
  .hwrap{grid-template-columns:1fr}
  .urow{grid-template-columns:52px 1fr}
  .urow .pill{grid-column:2}
  .urow .rd{grid-column:1/-1}
  .ghead h2{font-size:26px}
  .edge{width:38px}
  .clock{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.track,.edge{transition:none}}

.banner{padding:7px 16px;background:var(--dev-bg);color:var(--dev);font-size:14px;border-bottom:1px solid #4e3d1c}
.banner button{color:var(--dev);text-decoration:underline;padding:0 4px}
.app.offline .stage,.app.offline .foot{filter:grayscale(1);opacity:.35}
.offmsg{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 26px;text-align:center;max-width:calc(100% - 32px)}
.offmsg b{display:block;font-size:26px;margin-bottom:6px;color:var(--text)}
.offmsg span{color:var(--dim)}
.empty{padding:40px 0;color:var(--dim);font-size:18px;line-height:1.7}
.urow .rd .chk{display:block;color:var(--bad);font-size:14px}
.urow .rd .chk.warn{color:var(--dev)}
.urow .rd .note{color:var(--dev);font-size:13px}
.hid .warn{margin-top:10px;font-size:13px;color:var(--dev);line-height:1.5}
.pulls{overflow:auto;flex:1;border:1px solid var(--line);border-radius:6px}
.pulls table{border-collapse:collapse;width:100%;font-size:13px}
.pulls th,.pulls td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pulls th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--panel)}
.pulls td.nm{font-family:var(--mono);white-space:nowrap}
.drawer ul{margin:0;padding-left:18px;color:var(--dev);font-size:13px;line-height:1.6}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.meta dt{color:var(--dim)} .meta dd{margin:0;font-family:var(--mono);word-break:break-all}
</style></head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">nodedata 巡视台<small id="cnt"></small></div>
    <nav class="dims" id="dims" aria-label="按什么翻页"></nav>
    <span class="sp"></span>
    <button class="tool" id="invBtn" type="button">拉取状况</button>
    <span class="clock" id="clock">--:--:--</span>
  </header>
  <div class="banner" id="banner" hidden></div>

  <main class="stage" id="stage">
    <button class="edge l" id="prev" type="button" aria-label="上一页"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="cnt" id="lc" hidden></span></button>
    <div class="track" id="track"><section class="page"><div class="empty">正在连接巡视台…</div></section></div>
    <button class="edge r" id="next" type="button" aria-label="下一页"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg><span class="cnt" id="rc" hidden></span></button>
  </main>

  <footer class="foot">
    <button class="back" id="back" type="button" hidden></button>
    <span class="pos" id="pos">– / –</span>
    <span id="pname"></span>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <span id="pstate">轮播中</span>
    <label>每页 <select id="dwell"><option value="10">10 秒</option><option value="15" selected>15 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select></label>
    <button class="tool" id="hold" type="button">暂停</button>
  </footer>
</div>
<div class="offmsg" id="offmsg" hidden></div>

<div class="drawer" id="drawer" hidden>
  <div class="in">
    <h3>拉取状况</h3>
    <dl class="meta" id="meta"></dl>
    <div id="invErrs"></div>
    <p>下面是没拉到、或最近一次拉取失败的主机。改 host.list 不用重启，巡视台每轮开始前会检查文件有没有变。</p>
    <div class="pulls" id="pulls"></div>
    <div class="row"><button class="go" id="invClose" type="button">关闭</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
var R=["CPU","内存","磁盘","网络","系统"], RS=["C","M","D","N","S"];
var DIMS=[{id:"host",label:"主机"},{id:"group",label:"主机组"},{id:"product",label:"产品线"},{id:"rack",label:"机柜"},{id:"dc",label:"机房"},{id:"tags",label:"标签"}];
var STATE_TXT={ok:"正常",dev:"偏离",bad:"异常",lost:"失联",none:"无数据"};
var SEV={ok:0,none:1,dev:2,lost:3,bad:4};
var POLL=5000;

function pad(n,w){n=String(n);while(n.length<w)n="0"+n;return n}
function hm(sec){var d=new Date(sec*1000);return pad(d.getHours(),2)+":"+pad(d.getMinutes(),2)}
function hms(ms){var d=new Date(ms);return pad(d.getHours(),2)+":"+pad(d.getMinutes(),2)+":"+pad(d.getSeconds(),2)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function pill(v){return '<span class="pill '+v+'">'+STATE_TXT[v]+'</span>'}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

// 时长按中心的时间算：iPad 的钟可能不准
function agoSec(sec){if(!S||!sec)return "";var m=Math.max(0,Math.round((S.at-sec)/60));return m<1?"不到 1 分钟":m<60?m+" 分钟":m<1440?Math.floor(m/60)+" 小时 "+(m%60)+" 分":Math.floor(m/1440)+" 天"}

function fmt(v,unit){
  if(v==null||!isFinite(v))return "—";
  if(unit==="bytes"){var u=["B","KiB","MiB","GiB","TiB"],i=0,x=Math.abs(v);while(x>=1024&&i<u.length-1){x/=1024;i++}return (v<0?"-":"")+x.toFixed(x<10?2:1)+" "+u[i]}
  if(unit==="bytes/s")return fmt(v,"bytes")+"/s";
  if(unit==="/s")return (Math.round(v*10)/10)+" /s";
  if(unit==="percent")return v.toFixed(1)+"%";
  if(unit==="ms")return v.toFixed(1)+" ms";
  if(Math.abs(v)>=1e6)return (v/1e6).toFixed(2)+"M";
  if(Math.abs(v)>=1000)return v.toFixed(0);
  return String(Math.round(v*100)/100);
}

/* ---------- 数据 ---------- */
var S=null, hosts=[], lastGood=0, fetchErr="", sig="";
var dim=location.hash.slice(1)||store("fleet.dim")||"rack", pages=[], cur=0, backTo=null;
if(!DIMS.some(function(d){return d.id===dim}))dim="rack";
var dwellSel=document.getElementById("dwell");
var dw=store("fleet.dwell"); if(dw&&/^(10|15|30|60)$/.test(dw))dwellSel.value=dw;

function poll(){
  var ctl=typeof AbortController!=="undefined"?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort()},POLL-500);
  fetch("api/state",{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
  }).then(function(s){
    clearTimeout(t);
    S=s; hosts=s.hosts||[]; lastGood=Date.now(); fetchErr="";
    var nsig=JSON.stringify(hosts.map(function(h){return [h.name,h.dc,h.rack,h.product,h.group,h.tags]}));
    if(nsig!==sig){sig=nsig;renderAll(pages[cur]?pages[cur].key:null)}else refreshPages();
    banner(); drawerFill();
  }).catch(function(e){clearTimeout(t);fetchErr=e&&e.name==="AbortError"?"请求超时":e&&e.name==="TypeError"?"连不上（网络断了，或巡视台进程没在跑）":String(e&&e.message||e)});
}


// 地址：可点（在新标签页打开那台的 nodedata 页面——需要你的电脑能直接连到它）+ 复制按钮（到处都能用）
function addrHTML(h){
  var a=esc(h.addr),s=h.link?'<a class="alink" href="'+esc(h.link)+'" target="_blank" rel="noopener" title="在新标签页打开这台的 nodedata 页面（需要你的电脑能直接连到它）">'+a+' ↗</a>':a;
  return s+' <button type="button" class="copy" data-copy="'+a+'" title="复制地址">复制</button>';
}
// 内网多半是 http：剪贴板接口只在 https/本机可用，退回到选中再复制
function copyText(t,done){
  function old(){var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);done(ok)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){done(true)},old)}else old();
}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("button.copy");if(!b)return;
  e.stopPropagation();
  copyText(b.dataset.copy,function(ok){var o=b.textContent;b.textContent=ok?"已复制":"复制失败，请长按选中";b.classList.toggle("done",ok);setTimeout(function(){b.textContent=o;b.classList.remove("done")},1600)});
},true);
function hostSev(h){return h.status==="lost"?"lost":h.sev||"none"}
function pageSev(p){var w="ok";p.hosts.forEach(function(h){var v=hostSev(h);if(SEV[v]>SEV[w])w=v});return w}
function rowOf(h,res){var rs=h.rows||[];for(var i=0;i<rs.length;i++)if(rs[i].resource===res)return rs[i];return null}

/* ---------- 分页 ---------- */
function groupKey(h,d){if(d==="rack")return h.rack?(h.dc?h.dc+" / ":"")+h.rack:"";return h[d]||""}
function byName(a,b){return a.name.localeCompare(b.name)}
function buildPages(){
  if(dim==="host")return hosts.slice().sort(byName).map(function(h){return {key:h.name,title:h.name,hosts:[h],host:true}});
  var m={};
  hosts.forEach(function(h){
    var ks=dim==="tags"?(h.tags&&h.tags.length?h.tags:["(无标签)"]):[groupKey(h,dim)||"(未填)"];
    ks.forEach(function(k){(m[k]=m[k]||[]).push(h)});
  });
  return Object.keys(m).sort(function(a,b){return a.localeCompare(b,"zh")}).map(function(k){return {key:k,title:k,hosts:m[k].sort(byName)}});
}
function dimLabel(){for(var i=0;i<DIMS.length;i++)if(DIMS[i].id===dim)return DIMS[i].label}

// 同时发生：同一资源、起点相差 3 分钟内的 ≥2 台。只用中心亲眼看到变坏的起点，只摆事实。
function together(p){
  var out=[];
  R.forEach(function(res){
    var xs=[];
    p.hosts.forEach(function(h){if(h.status==="lost")return;var r=rowOf(h,res);if(r&&r.st!=="ok"&&r.st!=="none"&&r.since_known)xs.push({h:h,t:r.since,v:r.st})});
    xs.sort(function(a,b){return a.t-b.t});
    var i=0;
    while(i<xs.length){
      var j=i;while(j+1<xs.length&&xs[j+1].t-xs[i].t<=180)j++;
      if(j>i){var g=xs.slice(i,j+1),anyBad=g.some(function(x){return x.v==="bad"});
        out.push('<div class="f"><b>'+res+'</b>：<span class="num">'+g.length+'</span> 台 '+hm(g[0].t)+(g[g.length-1].t-g[0].t>=60?'–'+hm(g[g.length-1].t):'')+' 开始'+(anyBad?'异常或偏离':'偏离')+' <span class="who">'+g.slice(0,4).map(function(x){return esc(x.h.name)}).join("、")+(g.length>4?" 等":"")+'</span></div>')}
      i=j+1;
    }
  });
  var lost=p.hosts.filter(function(h){return h.status==="lost"&&!h.never});
  if(lost.length>=2)out.push('<div class="f"><b>失联</b>：<span class="num">'+lost.length+'</span> 台 <span class="who">'+lost.slice(0,6).map(function(h){return esc(h.name)}).join("、")+(lost.length>6?" 等":"")+'</span></div>');
  var skew=p.hosts.filter(function(h){return h.status==="ok"&&Math.abs(h.skew||0)>5});
  if(out.length&&skew.length)out.push('<div class="f"><b>注意</b>：<span class="num">'+skew.length+'</span> 台时钟偏差超过 5 秒（'+skew.slice(0,3).map(function(h){return esc(h.name)+" "+(h.skew>0?"+":"")+h.skew+"s"}).join("、")+'），上面的先后不可全信</div>');
  return out;
}

function tileSub(h){
  if(h.status==="lost")return h.never?"从没拉到过":"失联 "+agoSec(h.last_ok);
  return R.filter(function(r){var x=rowOf(h,r);return x&&x.st!=="ok"}).map(function(r){return r+STATE_TXT[rowOf(h,r).st]}).join(" · ");
}

function renderGroup(p){
  var c={bad:0,dev:0,lost:0,ok:0};p.hosts.forEach(function(h){var v=hostSev(h);c[v==="none"?"ok":v]++});
  var facts=together(p);
  var h='<div class="ghead"><span class="kind">'+dimLabel()+'</span><h2>'+esc(p.title)+'</h2><div class="counts">';
  ["bad","dev","lost"].forEach(function(k){if(c[k])h+='<span class="pill '+k+'">'+STATE_TXT[k]+' <span class="num">'+c[k]+'</span></span>'});
  h+='<span class="pill ok">正常 <span class="num">'+c.ok+'</span></span><span class="pill none">共 <span class="num">'+p.hosts.length+'</span> 台</span></div></div>';
  if(facts.length)h+='<div class="facts"><div class="lbl">同时发生（只列事实，不代表同一原因）</div>'+facts.join("")+'</div>';
  h+='<div class="tiles'+(p.hosts.length>32?" dense":"")+'">';
  p.hosts.forEach(function(x){
    var sev=hostSev(x);
    h+='<button class="tile '+sev+'" type="button" data-host="'+esc(x.name)+'" aria-label="'+esc(x.name)+' '+STATE_TXT[sev]+'"><span class="nm">'+esc(x.name)+'</span><span class="segs">';
    R.forEach(function(r,i){var row=x.status==="lost"?null:rowOf(x,r),v=row?row.st:"none";h+='<span class="'+v+'" title="'+r+' '+STATE_TXT[v]+'">'+RS[i]+'</span>'});
    h+='</span><span class="sub">'+esc(tileSub(x))+'</span></button>';
  });
  return h+'</div><div class="legend"><span>方块五格依次是 CPU · 内存 · 磁盘 · 网络 · 系统</span><span>点方块看这台主机</span></div>';
}

function factHTML(f){
  var s=esc(f.label)+' <span class="num">'+esc(fmt(f.value,f.unit))+'</span>', ex=[];
  if(f.base!=null)ex.push("平时 "+esc(fmt(f.base,f.unit)));
  if(f.notable&&f.z!=null)ex.push("z="+f.z.toFixed(1));
  else if(f.change)ex.push(esc(f.change));
  if(ex.length)s+=' <span class="u">('+ex.join(", ")+')</span>';
  if(f.note)s+=' <span class="note">'+esc(f.note)+'</span>';
  return s;
}
function rowHTML(h,res){
  if(h.status==="lost")return '<div class="urow none"><span class="res">'+res+'</span>'+pill("none")+'<div class="rd"><span class="u">无数据</span></div></div>';
  var r=rowOf(h,res)||{st:"none"};
  var t=(r.facts||[]).map(factHTML).join(" · ")||'<span class="u">'+(r.st==="none"?"这台没报这一行":"")+'</span>';
  if(r.st!=="ok"&&r.since)t+=' <span class="u">· '+(r.since_known?hm(r.since)+" 起":"巡视台 "+hm(r.since)+" 开始看时已是这样")+'</span>';
  (r.checks||[]).forEach(function(c){t+='<span class="chk'+(c.level<2?" warn":"")+'">['+esc(c.id)+'] '+esc(c.name)+' '+esc(c.message)+'</span>'});
  if(r.movers&&r.movers.length)t+='<span class="who">谁干的 '+r.movers.slice(0,3).map(function(m){return esc(m.name)+(m.pid?"("+m.pid+")":"")+" "+esc(fmt(m.now,m.unit))+(m.parent?"，父进程 "+esc(m.parent):"")}).join("；")+'</span>';
  var ck=[];
  if(r.checked&&r.checked.length)ck.push("已查 "+r.checked.map(esc).join("、"));
  if(r.l0_total)ck.push("硬阈值 "+r.l0_pass+"/"+r.l0_total+" 通过");
  if(ck.length)t+='<span class="ck">'+ck.join("；")+'</span>';
  return '<div class="urow '+r.st+'"><span class="res">'+res+'</span>'+pill(r.st)+'<div class="rd">'+t+'</div></div>';
}

function renderHost(p){
  var x=p.hosts[0];
  var h='<div class="hwrap"><div class="hid"><h2>'+esc(x.name)+'</h2><div class="addr">'+addrHTML(x)+'</div><dl>'+
    '<dt>机房</dt><dd>'+esc(x.dc||"—")+'</dd><dt>机柜</dt><dd>'+esc(x.rack||"—")+'</dd><dt>产品线</dt><dd>'+esc(x.product||"—")+'</dd><dt>主机组</dt><dd>'+esc(x.group||"—")+'</dd>'+
    '<dt>标签</dt><dd>'+(x.tags&&x.tags.length?x.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join(""):"—")+'</dd></dl>';
  h+='<div class="seen">'+(x.last_ok?"最近拉到 "+hm(x.last_ok):"")+(x.agent?" · nodedata "+esc(x.agent):"")+'</div>';
  if(x.status==="ok"&&Math.abs(x.skew||0)>5)h+='<div class="warn">这台的时钟比巡视台'+(x.skew>0?"快":"慢")+' '+Math.abs(x.skew)+' 秒</div>';
  if(x.status==="ok"&&x.api===0)h+='<div class="warn">这台是旧版 nodedata（没有 /api/fleet），看不到它的时钟偏差</div>';
  if(x.status==="ok"&&x.err)h+='<div class="warn">最近一次拉取失败：'+esc(x.err)+'</div>';
  h+='</div><div class="use">';
  if(x.status==="lost")h+='<div class="lostbox">'+(x.never?"巡视台启动以来一次都没拉到这台":"失联：已经 "+agoSec(x.last_ok)+"没拉到这台")+(x.err?"。原因："+esc(x.err):"")+'。下面五行没有依据，不代表正常。</div>';
  R.forEach(function(r){h+=rowHTML(x,r)});
  return h+'</div></div>';
}

var track=document.getElementById("track");
function pageHTML(p){return p.host?renderHost(p):renderGroup(p)}
function renderAll(keepKey){
  pages=buildPages();
  if(!pages.length){track.innerHTML='<section class="page"><div class="empty">清单里还没有主机。<br>编辑 '+esc(S&&S.inventory?S.inventory.path:"host.list")+'，一台一行：名字 地址:端口 dc=… rack=…</div></section>';updateChrome();return}
  track.innerHTML=pages.map(function(p,i){return '<section class="page" aria-roledescription="页" aria-label="'+esc(p.title)+'">'+pageHTML(p)+'</section>'}).join("");
  var idx=0;if(keepKey!=null)for(var i=0;i<pages.length;i++)if(pages[i].key===keepKey){idx=i;break}
  jump(idx,false);
  document.getElementById("cnt").textContent=hosts.length+" 台";
  updateChrome();
}
function refreshPages(){
  pages=pages.map(function(p){ // 换成新数据里的同名主机对象
    var by={};hosts.forEach(function(h){by[h.name]=h});
    return {key:p.key,title:p.title,host:p.host,hosts:p.hosts.map(function(h){return by[h.name]||h})};
  });
  var secs=track.children;
  for(var i=0;i<pages.length&&i<secs.length;i++){var top=secs[i].scrollTop;secs[i].innerHTML=pageHTML(pages[i]);secs[i].scrollTop=top}
  updateChrome();
}

function jump(i,smooth){
  if(!pages.length)return;
  var wrap=i<0||i>=pages.length;
  i=(i+pages.length)%pages.length;cur=i;elapsed=0;
  if(wrap&&smooth){track.classList.add("fade");setTimeout(function(){track.scrollTo({left:i*track.clientWidth,behavior:"auto"});track.classList.remove("fade")},180)}
  else track.scrollTo({left:i*track.clientWidth,behavior:smooth?"smooth":"auto"});
  updateChrome();
}
track.addEventListener("scroll",function(){
  var i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));
  if(i!==cur&&i>=0&&i<pages.length){cur=i;elapsed=0;updateChrome()}
},{passive:true});
window.addEventListener("resize",function(){track.scrollTo({left:cur*track.clientWidth,behavior:"auto"})});

function updateChrome(){
  Array.prototype.forEach.call(document.querySelectorAll("#dims button"),function(x){x.setAttribute("aria-pressed",x.dataset.d===dim?"true":"false")});
  var p=pages[cur];
  document.getElementById("pos").textContent=p?(cur+1)+" / "+pages.length:"– / –";
  document.getElementById("pname").textContent=p?dimLabel()+" · "+p.title:"";
  var L={bad:0,dev:0,lost:0},Rt={bad:0,dev:0,lost:0};
  pages.forEach(function(q,i){if(i===cur)return;var v=pageSev(q);if(v in L)(i<cur?L:Rt)[v]++});
  badge("lc",L);badge("rc",Rt);
  var b=document.getElementById("back");
  if(backTo&&dim==="host"){b.hidden=false;b.textContent="← 回到 "+backTo.label+" · "+backTo.key}else b.hidden=true;
}
function badge(id,c){
  var el=document.getElementById(id),n=c.bad+c.dev+c.lost;
  if(!n){el.hidden=true;return}
  el.hidden=false;el.textContent=n;el.className="cnt "+(c.bad?"bad":c.lost?"lost":"dev");
  el.title=(c.bad?"异常 "+c.bad+" 页 ":"")+(c.dev?"偏离 "+c.dev+" 页 ":"")+(c.lost?"失联 "+c.lost+" 页":"");
}

/* ---------- 清单问题、断开 ---------- */
function banner(){
  var b=document.getElementById("banner"),inv=S&&S.inventory;
  if(!inv||!inv.errors||!inv.errors.length){b.hidden=true;return}
  b.hidden=false;
  b.innerHTML='清单有 '+inv.errors.length+' 处问题'+(inv.stale?'，新文件没有采用，仍在用 '+(S.inventory_loaded_at?hm(S.inventory_loaded_at):"上一版")+' 的版本':'')+'：'+esc(inv.errors[0])+' <button type="button" id="bannerMore">看全部</button>';
  document.getElementById("bannerMore").onclick=openDrawer;
}
function offlineState(){
  var now=Date.now();
  if(!lastGood)return fetchErr?{t:"连不上巡视台",d:fetchErr}:null;
  if(now-lastGood>3*POLL+2000)return {t:"巡视台断开",d:"最后一次更新 "+hms(lastGood)+(fetchErr?" · "+fetchErr:"")};
  if(S&&S.round_at&&S.at-S.round_at>3*S.interval)return {t:"巡视台停止拉取",d:"已经 "+(S.at-S.round_at)+" 秒没拉完一轮"};
  if(S&&!S.round_at&&S.at-S.started>3*S.interval)return {t:"巡视台停止拉取",d:"启动后还没拉完过一轮"};
  return null;
}

/* ---------- 抽屉 ---------- */
var drawer=document.getElementById("drawer");
function openDrawer(){drawer.hidden=false;drawerFill()}
function drawerFill(){
  if(drawer.hidden||!S)return;
  var inv=S.inventory||{};
  document.getElementById("meta").innerHTML='<dt>清单文件</dt><dd>'+esc(inv.path)+'</dd><dt>当前版本</dt><dd>'+(S.inventory_loaded_at?hms(S.inventory_loaded_at*1000):"—")+'</dd>'+
    '<dt>上一轮</dt><dd>'+(S.round_at?hms(S.round_at*1000)+"，用时 "+S.round_ms+" ms":"还没拉完过")+'</dd><dt>每轮间隔</dt><dd>'+S.interval+' 秒，'+S.lost_after+' 秒没拉到算失联</dd><dt>巡视台版本</dt><dd>'+esc(S.version)+'</dd>';
  document.getElementById("invErrs").innerHTML=inv.errors&&inv.errors.length?'<ul>'+inv.errors.map(function(e){return "<li>"+esc(e)+"</li>"}).join("")+'</ul>':"";
  var bad=hosts.filter(function(h){return h.status==="lost"||h.err});
  document.getElementById("pulls").innerHTML=bad.length?'<table><thead><tr><th>主机</th><th>地址</th><th>情况</th></tr></thead><tbody>'+bad.map(function(h){
    return '<tr><td class="nm">'+esc(h.name)+'</td><td class="nm">'+addrHTML(h)+'</td><td>'+(h.status==="lost"?(h.never?"从没拉到过":"失联 "+agoSec(h.last_ok)):"偶尔失败")+(h.err?"："+esc(h.err):"")+'</td></tr>'}).join("")+'</tbody></table>':'<div class="empty" style="padding:16px">全部拉取正常。</div>';
}
document.getElementById("invBtn").addEventListener("click",openDrawer);
document.getElementById("invClose").addEventListener("click",function(){drawer.hidden=true});

/* ---------- 层级切换 ---------- */
var dimsEl=document.getElementById("dims");
dimsEl.innerHTML=DIMS.map(function(d){return '<button type="button" data-d="'+d.id+'" aria-pressed="false">'+d.label+'</button>'}).join("");
dimsEl.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  backTo=null;dim=b.dataset.d;store("fleet.dim",dim);renderAll(null);touch();
});
track.addEventListener("click",function(e){
  var t=e.target.closest(".tile");if(!t||!pages[cur])return;
  backTo={dim:dim,label:dimLabel(),key:pages[cur].key};
  dim="host";renderAll(t.dataset.host);touch();
});
document.getElementById("back").addEventListener("click",function(){
  if(!backTo)return;var b=backTo;backTo=null;dim=b.dim;renderAll(b.key);touch();
});

/* ---------- 轮播 ---------- */
var elapsed=0,holdUntil=0,held=false,lastT=Date.now(),stage=document.getElementById("stage"),touchTimer=0;
function dwell(){return Number(dwellSel.value)*1000}
function touch(){
  holdUntil=Date.now()+60e3;stage.classList.add("touched");
  clearTimeout(touchTimer);touchTimer=setTimeout(function(){stage.classList.remove("touched")},2500);
  wake();
}
["pointerdown","wheel","keydown"].forEach(function(ev){document.addEventListener(ev,touch,{passive:true})});
document.getElementById("prev").addEventListener("click",function(){jump(cur-1,true)});
document.getElementById("next").addEventListener("click",function(){jump(cur+1,true)});
document.addEventListener("keydown",function(e){
  if(!drawer.hidden)return;
  if(e.key==="ArrowRight")jump(cur+1,true);else if(e.key==="ArrowLeft")jump(cur-1,true);
});
var holdBtn=document.getElementById("hold");
holdBtn.addEventListener("click",function(){held=!held;holdBtn.textContent=held?"继续轮播":"暂停";if(!held)holdUntil=0});
dwellSel.addEventListener("change",function(){elapsed=0;store("fleet.dwell",dwellSel.value)});

setInterval(function(){
  var t=Date.now(),dt=t-lastT;lastT=t;
  document.getElementById("clock").textContent=hms(t);
  var off=offlineState(),app=document.getElementById("app"),om=document.getElementById("offmsg");
  app.classList.toggle("offline",!!off);
  if(off){om.hidden=false;om.innerHTML="<b>"+esc(off.t)+"</b><span>"+esc(off.d)+"。现在屏上的状态不是实时的。</span>"}else om.hidden=true;
  var bar=document.getElementById("bar"),ps=document.getElementById("pstate");
  if(off||held||!drawer.hidden||pages.length<2){bar.classList.add("paused");ps.textContent=off?"已断开":pages.length<2?"只有一页":"已暂停";return}
  if(t<holdUntil){bar.classList.add("paused");ps.textContent="手动操作中，"+Math.ceil((holdUntil-t)/1000)+" 秒后继续";return}
  bar.classList.remove("paused");ps.textContent="轮播中";
  elapsed+=dt;
  document.getElementById("barFill").style.width=Math.min(100,elapsed/dwell()*100)+"%";
  if(elapsed>=dwell())jump(cur+1,true);
},250);

var lock=null;
function wake(){if(lock||!("wakeLock" in navigator))return;navigator.wakeLock.request("screen").then(function(l){lock=l;l.addEventListener("release",function(){lock=null})}).catch(function(){})}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){wake();poll()}});

poll();setInterval(poll,POLL);
})();
</script>
</body>
</html>
