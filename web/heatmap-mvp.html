<meta charset="utf-8">
<title>整机偏离度快照</title>
<style>
  :root {
    --bg: #0f1620;
    --panel: #151d29;
    --line: #22303f;
    --line-soft: #1a2431;
    --ink: #c6d2de;
    --ink-dim: #7b8b9c;
    --ink-faint: #4e5d6d;
    --cpu: #6ba3d6;
    --mem: #9b8ad4;
    --io: #d98a4a;
    --net: #5fb89a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  /* ---------- header ---------- */

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 28px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: #e4ecf4;
  }

  .meta {
    display: flex;
    gap: 22px;
    font-size: 11.5px;
    color: var(--ink-dim);
  }
  .meta b { color: var(--ink); font-weight: 500; }

  .hint {
    margin: 14px 0 20px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-dim);
    max-width: 62ch;
  }

  /* ---------- controls ---------- */

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 20px;
    margin-bottom: 16px;
  }

  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .seg button {
    background: transparent;
    border: 0;
    border-right: 1px solid var(--line);
    color: var(--ink-dim);
    font: inherit;
    font-size: 12px;
    padding: 6px 13px;
    cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] {
    background: #1e2a38;
    color: #e4ecf4;
  }
  .seg button:focus-visible { outline: 2px solid var(--cpu); outline-offset: -2px; }

  .thresh {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .thresh input { width: 130px; accent-color: var(--io); }
  .thresh output { color: var(--ink); min-width: 2.4em; }

  /* ---------- scale legend ---------- */

  .scale {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--ink-faint);
    margin-left: auto;
  }
  .ramp { display: flex; }
  .ramp i { width: 13px; height: 11px; display: block; }

  /* ---------- heatmap ---------- */

  .grid-shell { position: relative; }

  .rulebar {
    display: grid;
    margin-left: 168px;
    height: 20px;
    gap: 0;
    margin-bottom: 3px;
  }
  .rulebar span {
    align-self: end;
    height: 0;
    border-top: 3px solid transparent;
  }

  .rowline {
    display: grid;
    grid-template-columns: 168px 1fr;
    align-items: center;
  }

  .rowlabel {
    font-size: 11px;
    color: var(--ink-dim);
    padding-right: 12px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1;
  }
  .rowlabel .unit { color: var(--ink-faint); }

  .cells { display: grid; gap: 0; }
  .cells i {
    display: block;
    height: 11px;
    cursor: crosshair;
  }

  .domhead {
    display: grid;
    grid-template-columns: 168px 1fr;
    margin: 14px 0 4px;
  }
  .domhead:first-of-type { margin-top: 0; }
  .domhead .name {
    text-align: right;
    padding-right: 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink);
  }
  .domhead .rule {
    border-bottom: 1px solid var(--line-soft);
    align-self: end;
    height: 1px;
  }

  .axis {
    display: grid;
    grid-template-columns: 168px 1fr;
    margin-top: 8px;
  }
  .ticks {
    position: relative;
    height: 16px;
    border-top: 1px solid var(--line);
  }
  .ticks span {
    position: absolute;
    top: 4px;
    font-size: 10.5px;
    color: var(--ink-faint);
    transform: translateX(-50%);
  }

  .cursor {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #ffffff;
    opacity: 0.5;
    pointer-events: none;
  }

  /* ---------- absolute view ---------- */

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line-soft);
  }
  .spark {
    background: var(--bg);
    padding: 7px 8px 4px;
  }
  .spark .n {
    font-size: 10px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .spark svg { display: block; width: 100%; height: 30px; }

  /* ---------- readout ---------- */

  .readout {
    margin-top: 26px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
    min-height: 190px;
  }
  .readout h2 {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .readout .sub {
    font-size: 11.5px;
    color: var(--ink-dim);
    margin: 0 0 14px;
  }

  .verdict {
    display: inline-block;
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 2px;
    margin-bottom: 14px;
    border: 1px solid;
  }

  table { border-collapse: collapse; font-size: 11.5px; width: 100%; max-width: 720px; }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--line);
    padding: 0 14px 5px 0;
    font-size: 10.5px;
  }
  td { padding: 4px 14px 4px 0; color: var(--ink-dim); border-bottom: 1px solid var(--line-soft); }
  td.m { color: var(--ink); }
  td.z { text-align: right; font-variant-numeric: tabular-nums; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }

  .tip {
    position: fixed;
    pointer-events: none;
    background: #050a11;
    border: 1px solid var(--line);
    padding: 7px 10px;
    font-size: 11px;
    line-height: 1.55;
    color: var(--ink);
    white-space: nowrap;
    z-index: 20;
    opacity: 0;
    transition: opacity .08s;
  }
  .tip b { font-weight: 500; color: #fff; }
  .tip s { display: block; text-decoration: none; color: var(--ink-faint); }

  @media (max-width: 700px) {
    .rowline, .domhead, .axis { grid-template-columns: 104px 1fr; }
    .rulebar { margin-left: 104px; }
    .rowlabel { font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>整机偏离度快照</h1>
    <div class="meta">
      <span>主机 <b>db-node-07</b></span>
      <span>窗口 <b>02:00 – 03:00</b>，30 秒采样</span>
      <span>基线 <b>前 7 日同时段 median / MAD</b></span>
      <span><b>40</b> 指标 × <b>120</b> 采样</span>
    </div>
  </header>

  <p class="hint">
    这段数据里埋了两个异常事件，界面不告诉你哪个是真故障。
    先看归一化视图，判断完再切到绝对值视图，比较一下哪种更快。
    点任意一列看该时刻的偏离排名。
  </p>

  <div class="bar">
    <div class="seg" role="group">
      <button id="btnNorm" aria-pressed="true">归一化偏离</button>
      <button id="btnAbs" aria-pressed="false">绝对值</button>
    </div>
    <label class="thresh">
      判定阈值 |z| ≥
      <input type="range" id="th" min="2" max="6" step="0.5" value="3">
      <output id="thv">3.0</output>
    </label>
    <div class="scale">
      <span>−6</span>
      <div class="ramp" id="ramp"></div>
      <span>+6</span>
      <span style="margin-left:6px">σ<sub>robust</sub></span>
    </div>
  </div>

  <div id="view"></div>

  <div class="readout" id="readout">
    <h2>点击热力图任意一列</h2>
    <p class="sub">显示该时刻偏离基线最远的指标，按 |z| 排序。</p>
  </div>
</div>

<div class="tip" id="tip"></div>

<script>
(() => {
  // ---------- deterministic RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20260906);
  const gauss = () => {
    let u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  // ---------- metric catalog ----------
  // kind: g = gauge, c = counter (rate applied at collection)
  const DOMAINS = [
    { id: 'cpu', name: 'CPU', color: 'var(--cpu)', hex: '#6ba3d6' },
    { id: 'mem', name: 'MEM', color: 'var(--mem)', hex: '#9b8ad4' },
    { id: 'io',  name: 'IO',  color: 'var(--io)',  hex: '#d98a4a' },
    { id: 'net', name: 'NET', color: 'var(--net)', hex: '#5fb89a' },
  ];

  const M = [
    ['cpu', 'cpu.user',           '%',      22,   3.0, 'g'],
    ['cpu', 'cpu.sys',            '%',       9,   1.8, 'g'],
    ['cpu', 'cpu.iowait',         '%',     1.4,   0.5, 'g'],
    ['cpu', 'cpu.steal',          '%',     0.3,   0.1, 'g'],
    ['cpu', 'cpu.softirq',        '%',     2.1,   0.4, 'g'],
    ['cpu', 'ctxt',               '/s',  48000,  4200, 'c'],
    ['cpu', 'intr',               '/s',  31000,  2600, 'c'],
    ['cpu', 'procs_running',      '',      2.4,   0.8, 'g'],
    ['cpu', 'procs_blocked',      '',      0.1,  0.32, 'g'],
    ['cpu', 'loadavg.1m',         '',      2.2,   0.5, 'g'],

    ['mem', 'mem.free',           'GB',    9.4,   0.7, 'g'],
    ['mem', 'mem.available',      'GB',   21.8,   1.1, 'g'],
    ['mem', 'mem.cached',         'GB',   14.2,   0.9, 'g'],
    ['mem', 'mem.buffers',        'GB',    1.1,  0.15, 'g'],
    ['mem', 'mem.dirty',          'MB',     62,    18, 'g'],
    ['mem', 'mem.writeback',      'MB',    1.2,   1.0, 'g'],
    ['mem', 'pgfault',            '/s',  18000,  2400, 'c'],
    ['mem', 'pgmajfault',         '/s',      3,   1.6, 'c'],
    ['mem', 'swap.used',          'MB',      0,   0.4, 'g'],
    ['mem', 'slab',               'GB',    2.6,  0.12, 'g'],

    ['io',  'disk.read',          'MB/s',   34,   9.0, 'c'],
    ['io',  'disk.write',         'MB/s',   58,    14, 'c'],
    ['io',  'disk.riops',         '/s',   1250,   280, 'c'],
    ['io',  'disk.wiops',         '/s',   2100,   420, 'c'],
    ['io',  'disk.await_r',       'ms',    0.9,  0.25, 'g'],
    ['io',  'disk.await_w',       'ms',    1.3,  0.35, 'g'],
    ['io',  'disk.util',          '%',      28,   6.5, 'g'],
    ['io',  'disk.inflight',      '',      1.8,   0.7, 'g'],
    ['io',  'disk.merged',        '/s',    340,    80, 'c'],
    ['io',  'disk.queue',         '',     0.35,  0.12, 'g'],

    ['net', 'net.rx',             'MB/s',   96,    18, 'c'],
    ['net', 'net.tx',             'MB/s',  142,    24, 'c'],
    ['net', 'net.rx_pps',         'k/s',    88,    15, 'c'],
    ['net', 'net.tx_pps',         'k/s',   104,    17, 'c'],
    ['net', 'net.rx_drop',        '/s',      0,   0.3, 'c'],
    ['net', 'net.tx_drop',        '/s',      0,   0.2, 'c'],
    ['net', 'tcp.retrans',        '/s',    2.1,   1.1, 'c'],
    ['net', 'tcp.estab',          '',     4200,   260, 'g'],
    ['net', 'conntrack',          '',    12400,   900, 'g'],
    ['net', 'tcp.listen_overflow','/s',      0,  0.15, 'c'],
  ].map(([dom, name, unit, base, sd, kind]) => ({ dom, name, unit, base, sd, kind }));

  const N = 120;                       // 120 × 30s = 1h
  const T0 = new Date('2026-09-06T02:00:00');

  // ---------- events ----------
  // A: benign traffic surge, t 20–32. Loud, single-domain, no downstream effect.
  // B: IO saturation cascade, t 64–90. Crosses CPU/MEM/IO/NET.
  const bump = (t, a, b, peak) => {
    if (t < a || t > b) return 0;
    const p = (t - a) / (b - a);
    return peak * Math.sin(Math.PI * p) ** 1.5;
  };

  const EFFECT = {
    'net.rx':        t => bump(t, 20, 32, 3.4),
    'net.tx':        t => bump(t, 20, 32, 3.1) - bump(t, 64, 90, 2.6),
    'net.rx_pps':    t => bump(t, 20, 32, 3.6),
    'net.tx_pps':    t => bump(t, 20, 32, 3.2) - bump(t, 64, 90, 2.3),
    'cpu.softirq':   t => bump(t, 20, 32, 1.6) ,

    'disk.util':     t => bump(t, 64, 90, 9.5),
    'disk.await_w':  t => bump(t, 64, 90, 11.0),
    'disk.await_r':  t => bump(t, 64, 90, 7.4),
    'disk.queue':    t => bump(t, 64, 90, 9.0),
    'disk.inflight': t => bump(t, 64, 90, 6.8),
    'disk.wiops':    t => bump(t, 64, 90, 2.2),
    'disk.write':    t => bump(t, 64, 90, 1.9),
    'disk.merged':   t => bump(t, 64, 90, 2.4),

    'cpu.iowait':      t => bump(t, 64, 90, 10.5),
    'procs_blocked':   t => bump(t, 64, 90, 8.8),
    'loadavg.1m':      t => bump(t, 66, 96, 5.2),
    'procs_running':   t => bump(t, 64, 90, 2.4),
    'cpu.user':        t => -bump(t, 64, 90, 2.7),
    'ctxt':            t => -bump(t, 64, 90, 2.0),

    'mem.dirty':      t => bump(t, 62, 90, 6.6),
    'mem.writeback':  t => bump(t, 64, 90, 7.8),
    'pgmajfault':     t => bump(t, 66, 90, 2.6),

    'tcp.estab':      t => bump(t, 66, 94, 4.1),
    'tcp.retrans':    t => bump(t, 68, 92, 2.8),
  };

  // ---------- synth ----------
  const series = M.map(m => {
    const vals = [];
    const drift = gauss() * 0.15;
    for (let t = 0; t < N; t++) {
      const eff = EFFECT[m.name] ? EFFECT[m.name](t) : 0;
      const diurnal = Math.sin((t / N) * Math.PI * 2 + drift) * 0.35;
      let v = m.base + m.sd * (gauss() + diurnal + eff);
      if (['%'].includes(m.unit)) v = Math.min(100, Math.max(0, v));
      else v = Math.max(0, v);
      vals.push(v);
    }
    return vals;
  });

  // baseline: 7 prior days, same window — median + MAD (robust)
  const stats = M.map((m, i) => {
    const draw = [];
    for (let d = 0; d < 7; d++)
      for (let t = 0; t < N; t++) {
        let v = m.base + m.sd * (gauss() + Math.sin((t / N) * Math.PI * 2) * 0.35);
        draw.push(Math.max(0, v));
      }
    draw.sort((a, b) => a - b);
    const med = draw[draw.length >> 1];
    const dev = draw.map(x => Math.abs(x - med)).sort((a, b) => a - b);
    const mad = dev[dev.length >> 1] || 1e-9;
    return { med, sigma: Math.max(1.4826 * mad, m.sd * 0.15, 1e-9) };
  });

  const Z = series.map((vals, i) =>
    vals.map(v => Math.max(-6, Math.min(6, (v - stats[i].med) / stats[i].sigma)))
  );

  // ---------- color ----------
  const lerp = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const NEUTRAL = [19, 26, 36];
  const COOL = [[27, 62, 84], [30, 110, 128], [42, 168, 174], [128, 224, 216]];
  const WARM = [[92, 56, 30], [166, 104, 32], [214, 122, 44], [242, 96, 60], [255, 152, 120]];

  function colorFor(z) {
    const a = Math.min(Math.abs(z), 6) / 6;
    if (a < 0.06) return rgb(NEUTRAL);
    const ramp = z < 0 ? COOL : WARM;
    const p = a * (ramp.length - 1);
    const i = Math.min(Math.floor(p), ramp.length - 2);
    const base = lerp(NEUTRAL, ramp[0], Math.min(a * 3.2, 1));
    return rgb(a < 0.3 ? base : lerp(ramp[i], ramp[i + 1], p - i));
  }

  // ---------- rule engine (the DeltaScope-style part) ----------
  // A domain "fires" when enough of its metrics deviate at the same instant.
  function domainHits(t, th) {
    const out = {};
    DOMAINS.forEach(d => out[d.id] = 0);
    M.forEach((m, i) => { if (Math.abs(Z[i][t]) >= th) out[m.dom]++; });
    return out;
  }
  function classify(t, th) {
    const h = domainHits(t, th);
    const live = DOMAINS.filter(d => h[d.id] >= 3);
    if (!live.length) return null;
    return { live, hits: h, cascade: live.length >= 3 };
  }

  // ---------- render ----------
  const view = document.getElementById('view');
  const tip = document.getElementById('tip');
  const readout = document.getElementById('readout');
  const th = document.getElementById('th');
  const thv = document.getElementById('thv');
  let mode = 'norm', threshold = 3, selected = null;

  const fmt = (v, m) => {
    if (m.unit === '%' || m.unit === 'ms') return v.toFixed(1);
    if (v >= 10000) return Math.round(v).toLocaleString();
    if (v >= 100) return v.toFixed(0);
    if (v >= 10) return v.toFixed(1);
    return v.toFixed(2);
  };
  const clock = t => {
    const d = new Date(T0.getTime() + t * 30000);
    return d.toTimeString().slice(0, 8);
  };

  // legend ramp
  const ramp = document.getElementById('ramp');
  for (let i = -6; i <= 6; i++) {
    const s = document.createElement('i');
    s.style.background = colorFor(i);
    ramp.appendChild(s);
  }

  function renderNorm() {
    const cols = `repeat(${N}, 1fr)`;
    let h = '<div class="grid-shell" id="shell">';

    // rule bar
    h += `<div class="rulebar" style="grid-template-columns:${cols}">`;
    for (let t = 0; t < N; t++) {
      const c = classify(t, threshold);
      let col = 'transparent';
      if (c) col = c.cascade ? '#f2603c' : c.live[0].hex;
      h += `<span style="border-top-color:${col}"></span>`;
    }
    h += '</div>';

    DOMAINS.forEach(d => {
      h += `<div class="domhead"><div class="name" style="color:${d.hex}">${d.name}</div><div class="rule"></div></div>`;
      M.forEach((m, i) => {
        if (m.dom !== d.id) return;
        h += `<div class="rowline"><div class="rowlabel">${m.name}${m.unit ? ` <span class="unit">${m.unit}</span>` : ''}</div>`;
        h += `<div class="cells" style="grid-template-columns:${cols}">`;
        for (let t = 0; t < N; t++)
          h += `<i data-m="${i}" data-t="${t}" style="background:${colorFor(Z[i][t])}"></i>`;
        h += '</div></div>';
      });
    });

    // time axis
    h += `<div class="axis"><div></div><div class="ticks">`;
    for (let t = 0; t < N; t += 20)
      h += `<span style="left:${(t + 0.5) / N * 100}%">${clock(t).slice(0, 5)}</span>`;
    h += `<span style="left:100%;transform:translateX(-100%)">03:00</span></div></div>`;
    h += '</div>';
    view.innerHTML = h;
    if (selected !== null) drawCursor();
  }

  function renderAbs() {
    let h = '<div class="wall">';
    M.forEach((m, i) => {
      const v = series[i];
      const lo = Math.min(...v), hi = Math.max(...v);
      const span = (hi - lo) || 1;
      const pts = v.map((x, t) => `${(t / (N - 1) * 100).toFixed(2)},${(28 - (x - lo) / span * 26).toFixed(2)}`).join(' ');
      const c = DOMAINS.find(d => d.id === m.dom).hex;
      h += `<div class="spark"><div class="n">${m.name}</div>
        <svg viewBox="0 0 100 30" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="0.8" vector-effect="non-scaling-stroke"/>
        </svg></div>`;
    });
    view.innerHTML = h + '</div>';
  }

  function render() { mode === 'norm' ? renderNorm() : renderAbs(); }

  function drawCursor() {
    const shell = document.getElementById('shell');
    if (!shell) return;
    const old = shell.querySelector('.cursor');
    if (old) old.remove();
    const anyRow = shell.querySelector('.cells');
    if (!anyRow) return;
    const left = anyRow.getBoundingClientRect().left - shell.getBoundingClientRect().left;
    const w = anyRow.getBoundingClientRect().width;
    const el = document.createElement('div');
    el.className = 'cursor';
    el.style.left = `${left + (selected + 0.5) / N * w}px`;
    shell.appendChild(el);
  }

  function showReadout(t) {
    const c = classify(t, threshold);
    const ranked = M.map((m, i) => ({ m, z: Z[i][t], v: series[i][t], med: stats[i].med }))
      .filter(r => Math.abs(r.z) >= 1.5)
      .sort((a, b) => Math.abs(b.z) - Math.abs(a.z))
      .slice(0, 12);

    let verdict = '';
    if (c && c.cascade) {
      const names = c.live.map(d => d.name).join(' + ');
      verdict = `<div class="verdict" style="color:#f2603c;border-color:#5c2b1e;background:#1e1210">跨域级联 · ${names} · ${c.live.length} 个域同时偏离</div>`;
    } else if (c) {
      verdict = `<div class="verdict" style="color:${c.live[0].hex};border-color:var(--line);background:#141c26">单域偏离 · ${c.live[0].name} · 无下游传导</div>`;
    } else {
      verdict = `<div class="verdict" style="color:var(--ink-dim);border-color:var(--line);background:#141c26">无域达到判定阈值</div>`;
    }

    let rows = ranked.map(r => {
      const d = DOMAINS.find(x => x.id === r.m.dom);
      const sign = r.z > 0 ? '+' : '−';
      return `<tr>
        <td class="m"><span class="dot" style="background:${d.hex}"></span>${r.m.name}</td>
        <td class="v">${fmt(r.v, r.m)}${r.m.unit ? ' ' + r.m.unit : ''}</td>
        <td class="v">${fmt(r.med, r.m)}</td>
        <td class="z" style="color:${colorFor(r.z)};filter:brightness(1.5)">${sign}${Math.abs(r.z).toFixed(1)}σ</td>
      </tr>`;
    }).join('');
    if (!rows) rows = `<tr><td colspan="4" style="padding-top:10px">该时刻所有指标均在基线 1.5σ 内。</td></tr>`;

    readout.innerHTML = `
      <h2>${clock(t)}</h2>
      <p class="sub">采样 #${t} · 偏离基线 ≥1.5σ 的指标，按幅度排序</p>
      ${verdict}
      <table>
        <tr><th>指标</th><th style="text-align:right">当前</th><th style="text-align:right">基线中位数</th><th style="text-align:right">偏离</th></tr>
        ${rows}
      </table>`;
  }

  // ---------- events ----------
  view.addEventListener('mousemove', e => {
    const c = e.target.closest('i[data-m]');
    if (!c) { tip.style.opacity = 0; return; }
    const i = +c.dataset.m, t = +c.dataset.t, m = M[i];
    tip.innerHTML = `<b>${m.name}</b> ${clock(t)}<s>当前 ${fmt(series[i][t], m)}${m.unit ? ' ' + m.unit : ''} · 基线 ${fmt(stats[i].med, m)}</s><s>偏离 ${Z[i][t] >= 0 ? '+' : '−'}${Math.abs(Z[i][t]).toFixed(1)}σ</s>`;
    tip.style.opacity = 1;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + 'px';
    tip.style.top = Math.max(e.clientY - r.height - 10, 8) + 'px';
  });
  view.addEventListener('mouseleave', () => tip.style.opacity = 0);

  view.addEventListener('click', e => {
    const c = e.target.closest('i[data-m]');
    if (!c) return;
    selected = +c.dataset.t;
    drawCursor();
    showReadout(selected);
  });

  document.getElementById('btnNorm').onclick = () => setMode('norm');
  document.getElementById('btnAbs').onclick = () => setMode('abs');
  function setMode(m) {
    mode = m;
    document.getElementById('btnNorm').setAttribute('aria-pressed', m === 'norm');
    document.getElementById('btnAbs').setAttribute('aria-pressed', m === 'abs');
    render();
  }

  th.oninput = () => {
    threshold = +th.value;
    thv.textContent = threshold.toFixed(1);
    if (mode === 'norm') render();
    if (selected !== null) showReadout(selected);
  };

  addEventListener('resize', () => { if (mode === 'norm' && selected !== null) drawCursor(); });

  render();
})();
</script>
